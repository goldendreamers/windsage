plugins {
    id("com.android.application")
}

android {
    namespace "bio.nimrod.cursorface"
    compileSdk 34

    defaultConfig {
        applicationId "bio.nimrod.cursorface"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
}
