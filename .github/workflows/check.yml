name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check cloud
        run: find code/cloud -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Unit checks
        run: node scripts/check-auth.mjs && node scripts/check-oauth.mjs
      - name: Alert checks
        run: npx --yes tsx scripts/check-alerts.ts
